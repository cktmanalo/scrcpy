name: Scrcpy Monitor macOS and Linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload to (e.g. qa-v5.0.1-11-g1234abcd)'
        required: true
      upload:
        description: 'Upload the packages to the release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
  VERSION: ${{ github.event.release.tag_name || github.event.inputs.tag }}
  UPLOAD: ${{ github.event_name == 'release' || github.event.inputs.upload == 'true' }}

jobs:
  build-scrcpy-server:
    runs-on: ubuntu-latest
    env:
      GRADLE: gradle
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build
        run: release/build_server.sh

      - uses: actions/upload-artifact@v7
        with:
          name: scrcpy-server
          path: release/work/build-server/server/scrcpy-server

  build-macos:
    needs: build-scrcpy-server
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
            asset: arm64
          - runner: macos-15-intel
            arch: x86_64
            asset: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Install dependencies
        run: brew install meson nasm libiconv zlib automake autoconf libtool || true

      - name: Build scrcpy
        env:
          MACOSX_DEPLOYMENT_TARGET: 10.13
        run: release/build_macos.sh ${{ matrix.arch }}

      - uses: actions/download-artifact@v8
        with:
          name: scrcpy-server
          path: release/work/build-server/server/

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Stage binaries
        run: |
          mkdir -p monitor-py/bin
          cp -R release/work/build-macos-${{ matrix.arch }}/dist/. monitor-py/bin/
          cp release/work/build-server/server/scrcpy-server monitor-py/bin/
          chmod +x monitor-py/bin/scrcpy monitor-py/bin/adb
          printf '{"Repo":"%s","Version":"%s","Built":"%s"}\n' "$GITHUB_REPOSITORY" "$TAG" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > monitor-py/update.json

      - name: Test
        working-directory: monitor-py
        run: |
          python -m pip install -r requirements.txt pyinstaller
          QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v

      - name: Build app
        working-directory: monitor-py
        run: |
          pyinstaller --noconfirm --clean scrcpy-monitor.spec
          zip_name="scrcpy-monitor-macos-${{ matrix.asset }}-$TAG.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Scrcpy Monitor.app" "../$zip_name"
          echo "PACKAGE=$zip_name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: scrcpy-monitor-macos-${{ matrix.asset }}
          path: ${{ env.PACKAGE }}

      - name: Upload to release
        if: ${{ env.UPLOAD == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$PACKAGE" --repo "$GITHUB_REPOSITORY" --clobber

  build-linux:
    needs: build-scrcpy-server
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm ffmpeg libavcodec-dev \
             libavdevice-dev libavformat-dev libavutil-dev libswresample-dev \
             libusb-1.0-0 libusb-1.0-0-dev libv4l-dev \
             libasound2-dev libpulse-dev \
             libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
             libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
             libxkbcommon-dev libdrm-dev libva-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
             libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
             libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev \
             libxcb-cursor0 libxkbcommon-x11-0 libegl1

      - name: Build scrcpy
        run: release/build_linux.sh x86_64

      - uses: actions/download-artifact@v8
        with:
          name: scrcpy-server
          path: release/work/build-server/server/

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Stage binaries
        run: |
          mkdir -p monitor-py/bin
          cp -R release/work/build-linux-x86_64/dist/. monitor-py/bin/
          cp release/work/build-server/server/scrcpy-server monitor-py/bin/
          chmod +x monitor-py/bin/scrcpy monitor-py/bin/adb
          printf '{"Repo":"%s","Version":"%s","Built":"%s"}\n' "$GITHUB_REPOSITORY" "$TAG" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > monitor-py/update.json

      - name: Test
        working-directory: monitor-py
        run: |
          python -m pip install -r requirements.txt pyinstaller
          QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v

      - name: Build app
        working-directory: monitor-py
        run: |
          pyinstaller --noconfirm --clean scrcpy-monitor.spec
          package="scrcpy-monitor-linux-x86_64-$TAG.tar.gz"
          tar -C dist -czf "../$package" scrcpy-monitor
          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: scrcpy-monitor-linux-x86_64
          path: ${{ env.PACKAGE }}

      - name: Upload to release
        if: ${{ env.UPLOAD == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$PACKAGE" --repo "$GITHUB_REPOSITORY" --clobber
